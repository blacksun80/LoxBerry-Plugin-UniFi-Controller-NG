[HELP]
INTRO=Betreibt die UniFi Network Application (Nachfolger des eingestellten UniFi Controller) zusammen mit MongoDB in Docker und bindet sie in LoxBerry ein.
REQUIREMENTS=Erfordert einen 64-bit-LoxBerry (LoxBerry 4.0 oder neuer) mit laufender Docker-Engine, die für den Benutzer <code>loxberry</code> erreichbar ist.
WEBUI=Öffne das UniFi-Webinterface auf Port 8443 und lege dort den Admin-Benutzer an.
INFORM=Damit die Geräte eingebunden werden, den Inform-Host auf den UniFi-Geräten setzen: <b>UniFi Devices &rarr; Device Updates and Settings &rarr; Device SSH Settings &rarr; Inform Host Override</b>, dann den Hostnamen oder die IP-Adresse deines LoxBerry eintragen.
DIAG=Falls ein Container nicht startet, klappe auf der Hauptseite die <b>Diagnose</b> auf - sie sammelt systemd-Status, Container-Zustände, Speicherplatz und alle Logs.
WIKI_INFO=Ausführliche Dokumentation zu diesem Plugin:
WIKI_LINK=https://wiki.loxberry.de/plugins/unifi_controller_plugin-ng/start
WIKI_LINK_TEXT=UniFi Controller NG im LoxBerry-Wiki
GITHUB_INFO=Quellcode, Releases und Fehler-Tracker:
GITHUB_LINK=https://github.com/blacksun80/LoxBerry-Plugin-UniFi-Controller-NG
GITHUB_LINK_TEXT=UniFi Controller NG auf GitHub
CREDITS=Basiert auf dem ursprünglichen LoxBerry-Plugin-Unfi-Controller von Roman Lumetsberger. Danke für die Vorarbeit, auf der dieses Plugin aufbaut!
