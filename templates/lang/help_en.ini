[HELP]
INTRO=Runs the UniFi Network Application (the successor of the discontinued UniFi Controller) together with MongoDB in Docker and integrates it into LoxBerry.
REQUIREMENTS=Requires a 64-bit LoxBerry (LoxBerry 4.0 or newer) with a running Docker Engine that is reachable by the user <code>loxberry</code>.
WEBUI=Open the UniFi web interface on port 8443 and create the admin user there.
INFORM=For device adoption, set the inform host on your UniFi devices: <b>UniFi Devices &rarr; Device Updates and Settings &rarr; Device SSH Settings &rarr; Inform Host Override</b>, then enter the hostname or IP address of your LoxBerry.
DIAG=If a container fails to start, expand <b>Diagnostics</b> on the main page - it collects the systemd status, container states, disk space and all logs.
WIKI_INFO=Detailed documentation for this plugin:
WIKI_LINK=https://wiki.loxberry.de/plugins/unifi_controller_plugin-ng/start
WIKI_LINK_TEXT=UniFi Controller NG in the LoxBerry wiki
GITHUB_INFO=Source code, releases and issue tracker:
GITHUB_LINK=https://github.com/blacksun80/LoxBerry-Plugin-UniFi-Controller-NG
GITHUB_LINK_TEXT=UniFi Controller NG on GitHub
CREDITS=Based on the original LoxBerry-Plugin-Unfi-Controller by Roman Lumetsberger. Thank you for the original work that this builds on!
