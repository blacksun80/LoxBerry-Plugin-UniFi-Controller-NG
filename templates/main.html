<script>
// Update the service-status field periodically without reloading the whole page.
setInterval(function () {
    fetch('index.php?form=statusonly', { cache: 'no-store', credentials: 'same-origin' })
        .then(function (r) { return r.text(); })
        .then(function (t) {
            var el = document.getElementById('fld_status');
            if (el) { el.textContent = t.trim(); }
        })
        .catch(function () {});
}, 10000);
</script>
