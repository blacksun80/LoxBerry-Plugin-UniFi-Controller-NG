function unifing_status_style($status)
{
    if ($status === 'active') {
        return 'color:#155724; font-weight:bold;';
    }
    if ($status === 'failed') {
        return 'color:#721c24; font-weight:bold;';
    }
    return 'font-weight:bold;';
}

<script>
// Live-update service status (with colour) and controller version.
function unifingStatusColor(s) {
    if (s === 'active') { return '#155724'; }
    if (s === 'failed') { return '#721c24'; }
    return '';
}
setInterval(function () {
    fetch('index.php?form=statusonly', { cache: 'no-store', credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var s = document.getElementById('fld_status');
            if (s && d.status) { s.textContent = d.status; s.style.color = unifingStatusColor(d.status); }
            var c = document.getElementById('fld_controller');
            if (c && d.controller) { c.textContent = d.controller; }
        })
        .catch(function () {});
}, 10000);
</script>
