<div class="lb-content">
<h2><?php echo $L['DIAG.HEADING']; ?></h2>
<p><i><?php echo $L['DIAG.DESC']; ?></i></p>

<div style="margin-bottom:8px;">
    <a class="lb-btn lb-btn-sm" href="index.php"><?php echo $L['DIAG.BTN_BACK']; ?></a>
    <a class="lb-btn lb-btn-sm" href="index.php?form=diagnostics"><?php echo $L['DIAG.BTN_REFRESH']; ?></a>
    <label style="margin-left:12px;">
        <input type="checkbox" id="autorefresh" checked> <?php echo $L['DIAG.AUTOREFRESH']; ?>
    </label>
</div>

<div id="diagtabs" style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px;">
    <?php foreach ($sections as $i => $s) { ?>
        <button type="button" class="lb-btn lb-btn-sm diag-tab" data-target="diag_<?php echo $s['id']; ?>"
                style="<?php echo $i === 0 ? '' : 'opacity:0.6;'; ?>"><?php echo $s['title']; ?></button>
    <?php } ?>
</div>

<?php foreach ($sections as $i => $s) { ?>
<pre id="diag_<?php echo $s['id']; ?>" class="diag-pane" style="display:<?php echo $i === 0 ? 'block' : 'none'; ?>; height:72vh; overflow:auto; background:#1e1e1e; color:#d4d4d4; padding:10px; border:1px solid #ddd; font-size:12px; line-height:1.35; white-space:pre-wrap; word-break:break-all; border-radius:4px; margin:0;"><?php echo htmlspecialchars($s['content']); ?></pre>
<?php } ?>

<script>
(function () {
    var tabs  = Array.prototype.slice.call(document.querySelectorAll('.diag-tab'));
    var panes = Array.prototype.slice.call(document.querySelectorAll('.diag-pane'));
    var cb    = document.getElementById('autorefresh');
    var timer = null;

    function activate(id) {
        panes.forEach(function (p) { p.style.display = (p.id === id) ? 'block' : 'none'; });
        tabs.forEach(function (t) { t.style.opacity = (t.getAttribute('data-target') === id) ? '1' : '0.6'; });
    }
    tabs.forEach(function (t) {
        t.addEventListener('click', function () { activate(t.getAttribute('data-target')); });
    });

    function refresh() {
        fetch('index.php?form=diagnostics', { cache: 'no-store', credentials: 'same-origin' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
                var doc = new DOMParser().parseFromString(html, 'text/html');
                panes.forEach(function (p) {
                    var src = doc.getElementById(p.id);
                    if (!src) { return; }
                    var atBottom = (p.scrollTop + p.clientHeight >= p.scrollHeight - 20);
                    p.textContent = src.textContent;
                    if (atBottom) { p.scrollTop = p.scrollHeight; }
                });
            })
            .catch(function () {});
    }
    function schedule() {
        if (cb.checked) { timer = setTimeout(function () { refresh(); schedule(); }, 5000); }
    }
    cb.addEventListener('change', function () {
        if (timer) { clearTimeout(timer); timer = null; }
        schedule();
    });
    schedule();
})();
</script>
</div>
