---
# UniFi Network Application + MongoDB. 64-bit only (no arm32 images exist).
#
# ${VERSION} and ${MONGO_PASS} are substituted from the .env file in this
# directory (a symlink to the plugin config env, created by postroot.sh).
# init-mongo.js receives the same generated password at install time.
name: unifing
services:
  unifing-app:
    image: lscr.io/linuxserver/unifi-network-application:${VERSION}
    container_name: unifing-app
    env_file:
      - REPLACELBPCONFIGDIR/unifi.env
    environment:
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=unifing-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MEM_LIMIT=1024
      - MEM_STARTUP=256
    volumes:
      - unifing-appdata:/config
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      # 1900/udp (SSDP discovery) intentionally NOT mapped: LoxBerry already binds
      # it, and it is not needed for admin access via 8443. Enable only if free.
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514/udp
    depends_on:
      - unifing-db
    restart: unless-stopped

  unifing-db:
    image: docker.io/mongo:4.4
    container_name: unifing-db
    volumes:
      - unifing-dbdata:/data/db
      - REPLACELBPDATADIR/docker/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    restart: unless-stopped

# Named volumes persist independently of the plugin folder, so the UniFi config
# and MongoDB data survive a plugin update (which deletes and recreates the
# plugin folder). They are removed explicitly on uninstall.
volumes:
  unifing-appdata:
    name: unifing-appdata
  unifing-dbdata:
    name: unifing-dbdata
